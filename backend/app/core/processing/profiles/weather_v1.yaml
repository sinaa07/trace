id: weather_v1
domain: environment
source_types:
  - weather
version: "1.0.0"
required_fields:
  - timestamp
entity_fields: []
unit_fields:
  - temperature
  - rainfall
  - visibility
match:
  required_any_headers:
    - temperature
    - rainfall
    - visibility
    - temp
  filename_patterns:
    - "*weather*"
    - "*met*"
  content_hints: []
  min_score: 0.35
field_map:
  timestamp:
    - timestamp
    - time
    - observed_at
  temperature:
    - temperature
    - temp
    - temp_c
  rainfall:
    - rainfall
    - rain
    - precipitation_mm
  visibility:
    - visibility
    - visibility_km
event_rules:
  - emit: WEATHER_OBSERVATION
    required_fields: [timestamp]
    attribute_map:
      temperature: temperature
      rainfall: rainfall
      visibility: visibility
