id: witness_v1
domain: other
source_types:
  - witness
version: "1.0.0"
required_fields: []
entity_fields: []
unit_fields: []
match:
  required_any_headers:
    - statement
    - text
    - message
  filename_patterns:
    - "*witness*"
    - "*statement*"
  content_hints: []
  min_score: 0.25
field_map:
  timestamp:
    - timestamp
    - time
  statement:
    - statement
    - text
    - line
    - message
event_rules:
  - emit: WITNESS_STATEMENT
    required_fields: [statement]
    attribute_map:
      statement: statement
